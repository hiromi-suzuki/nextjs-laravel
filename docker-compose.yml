services:
  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    working_dir: /workspaces/nextjs-laravel
    volumes:
      - .:/workspaces/nextjs-laravel:cached
    command: sleep infinity
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: .devcontainer/backend.Dockerfile
    working_dir: /workspaces/nextjs-laravel/backend
    volumes:
      - .:/workspaces/nextjs-laravel:cached
    command: sh -c 'until [ -f artisan ]; do sleep 2; done; php artisan serve --host=0.0.0.0 --port=8000'
    ports:
      - "8000:8000"
